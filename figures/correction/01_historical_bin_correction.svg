  <g id="text_38">
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(19.8 408.104854)">POST-RESULT CORRECTION. Only the 372 historical design records chose the rule: 314 zero, 45 one, 13 two or more. The tail remains sparse. Future</text>
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #183047" transform="translate(19.8 418.307178)">larger integers use the same tail. Missing values keep their own bin. This chart explains a measurement fix; it does not show detection accuracy.</text>
