[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "subpsi"
version = "0.1.0"
description = "Traceable subgroup input-distribution monitoring experiments"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pandas>=2.2", "scipy>=1.14", "matplotlib>=3.9"]

[project.optional-dependencies]
test = ["pytest>=8", "statsmodels>=0.14"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
